[project]
name = "research-assistant"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastembed>=0.9.1",
    "pymupdf>=2.1",
    "rank-bm25>=0.2.2",
    "streamlit>=1.67.0",
]

[dependency-groups]
nli = [
    "sentencepiece>=0.2.3",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]
